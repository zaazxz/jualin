[build]
builder = "RAILPACK"
buildArgs = ["COMPOSER_INSTALL_ARGS=--no-dev --optimize-autoloader"]

[deploy]
port = 8080
healthcheckPath = "/up"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
# Jalankan migrasi saja, jangan seed ulang tiap startup biar nggak error duplicate
startCommand = "php artisan migrate --force && (php artisan queue:work --tries=3 --backoff=3 & /start-container.sh)"
