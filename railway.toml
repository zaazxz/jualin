[build]
builder = "RAILPACK"
buildArgs = ["COMPOSER_INSTALL_ARGS=--no-dev --optimize-autoloader"]

[deploy]
port = 8080
healthcheckPath = "/up"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
# Jalankan migrasi dan nyalakan worker di background agar registrasi cepat
startCommand = "php artisan migrate --force --seed && (php artisan queue:work --tries=3 --backoff=3 & /start-container.sh)"
