[build]
builder = "RAILPACK"
# Pastikan folder storage ada sebelum server jalan
startCommand = "mkdir -p storage/framework/{sessions,views,cache,testing} storage/logs bootstrap/cache && chmod -R a+rw storage && /start-container.sh"

[deploy]
port = 8080
healthcheckPath = "/up"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
